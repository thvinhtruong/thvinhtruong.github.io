---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title | escape }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time>
      {%- if page.tags.size > 0 -%}
        &middot;
        {%- for tag in page.tags -%}
          <a href="{{ '/tags/#' | append: tag | relative_url }}">#{{ tag }}</a>{%- unless forloop.last %} {% endunless -%}
        {%- endfor -%}
      {%- endif -%}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
