---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title | escape }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time>
      {%- if page.tags.size > 0 -%}
        &middot;
        {%- for tag in page.tags -%}
          <a href="{{ '/tags/#' | append: tag | relative_url }}">#{{ tag }}</a>{%- unless forloop.last %} {% endunless -%}
        {%- endfor -%}
      {%- endif -%}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
{%- if page.mermaid -%}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  // kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
  // Mermaid expects <div class="mermaid">, so rewrite them first.
  document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
  await mermaid.run();
</script>
{%- endif -%}
