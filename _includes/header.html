<header class="site-header wrap">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav">
    {%- for path in site.header_pages -%}
      {%- assign p = site.pages | where: "path", path | first -%}
      {%- if p -%}
        <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
      {%- endif -%}
    {%- endfor -%}
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☾</span>
    </button>
  </nav>
</header>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effective = current || (systemDark ? 'dark' : 'light');
      var next = effective === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
