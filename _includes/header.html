<header class="site-header wrap">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav">
    {%- for path in site.header_pages -%}
      {%- assign p = site.pages | where: "path", path | first -%}
      {%- if p -%}
        <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
      {%- endif -%}
    {%- endfor -%}
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme" aria-pressed="false">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☽</span>
    </button>
  </nav>
</header>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function effectiveTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      return current || (mq.matches ? 'dark' : 'light');
    }
    function syncPressed() {
      btn.setAttribute('aria-pressed', effectiveTheme() === 'dark' ? 'true' : 'false');
    }
    syncPressed();
    btn.addEventListener('click', function () {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      syncPressed();
    });
    mq.addEventListener && mq.addEventListener('change', syncPressed);
  })();
</script>
